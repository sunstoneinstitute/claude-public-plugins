[tools]
python = "3.11"
uv = "latest"

[tasks.test]
description = "Run the Python test suite"
# pytest exits 5 when it collects no tests. No plugin here ships tests yet, so
# treat "nothing collected" as a pass instead of a CI failure.
run = """
code=0
uv run pytest || code=$?
if [ "$code" -eq 5 ]; then code=0; fi
exit "$code"
"""
